<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes API Client</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>
    <header>
        <h1>QuickNotes</h1>
        <p>Connecting to the JSONPlaceholder API</p>
    </header>

    <main>
        <section class="controls">
            <button id="load-btn">Load 10 Notes</button>
            <p id="status" class="status-msg"></p>
        </section>

        <section class="add-note">
            <h2>Create a Note</h2>
            <form id="note-form">
                <div class="form-group">
                    <label for="title-input">Title (required, max 100 chars):</label>
                    <input type="text" id="title-input" maxlength="100">
                </div>
                <div class="form-group">
                    <label for="body-input">Body (optional):</label>
                    <textarea id="body-input"></textarea>
                </div>
                <button type="submit" id="submit-btn">Add Note</button>
            </form>
        </section>

        <section class="notes-display">
            <h2>Notes</h2>
            <ul id="notes-list">
                <!-- Notes will appear here -->
            </ul>
        </section>
    </main>
</body>
</html>
